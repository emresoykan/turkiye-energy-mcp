[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turkiye-energy-mcp"
version = "0.1.0"
description = "TEİAŞ ve EÜAŞ kapsamındaki resmî Türkiye elektrik verileri için MCP sunucusu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # Major-version upper bounds; exact tested versions live in constraints.txt.
  "httpx>=0.28,<1",
  # server.py uses mcp.server.MCPServer, which exists only in the 2.x SDK.
  "mcp>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  # Imported directly (OAuth shim, API-key middleware, HTTP runner).
  "starlette>=0.46,<2",
  "uvicorn>=0.31,<1",
  "tenacity>=9.1,<10",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
]

[project.scripts]
turkiye-energy-mcp = "turkiye_energy_mcp.server:main"
ytbs-sync = "turkiye_energy_mcp.ytbs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["turkiye_energy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
